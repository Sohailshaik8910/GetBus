{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetBus</title>
    <link rel="icon" href="{% static './images/bus_tit.png' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="{% static './css/base.css' %}">
</head>
<body>


  <!----1.Nav Bar---------------------------------------------------------------------------------------------------------->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
    <img id="main_logo" src="{% static './images/bus_tit.png' %}" alt="">
    <h1 id="title1">Get<span id="title_span" style="color: #920622; ">Bus</span></h1>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'list' %}"><i class="fa-solid fa-bus"></i> Buses</a>
          </li>
        
          <li class="nav-item">
            <a class="nav-link" href="{% url 'tickets' %}"><i style="margin-right: 2px;" class="fa-solid fa-ticket"></i> Track Tickect</a>
          </li> 
        </ul>
        <div class="navbar-text">

          <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          {% if request.user.username %}       
            <li class="nav-item">
              <a class="nav-link" href="#"><i class="fa-solid fa-user"></i> {{request.user.username}}</a>
            </li> 
            <li class="nav-item">
              <a class="nav-link" href="{% url 'logout' %}"><i class="fa-solid fa-house"></i> Logout</a>
            </li> 

          {%else%}

            <li class="nav-item">
              <a class="nav-link" href="{% url 'register' %}"><i class="fa-solid fa-user"></i> SignIn</a>
            </li> 
            <li class="nav-item">
              <a class="nav-link" href="{% url 'login' %}"><i class="fa-solid fa-right-from-bracket"></i> Login</a>
            </li> 
          {%endif%}


             


          </ul>
        </div>
      </div>
    </div>
  </nav>
 
<!------2. Middle Search Tab------------------------------------------------------------------------------------------------->

<form action="{% url 'search' %}" >

<div class="Middle_box">

  
  <div class="search_box">
    <i id="search_logo" class="fa-solid fa-bus"></i>
    <input type="text" name="from" placeholder="From">
    <i id="search_logo" class="fa-solid fa-bus"></i>
    <input type="text" name="to" placeholder="To">
    <input type="date" name="date" >
    <input id="Search_button"  type="submit" value="SEARCH BUS">
  </div>
</div>

</form>

<!----------------------------------Block Start--------------------------------------------------------------------------------------->

{%block content%}  


{%endblock%}



<!----------------------------------End block--------------------------------------------------------------------------------------->










  







<!-------9. Footer--------------------------------------------------------------------------------------------------------------->


<div class="card text-center">
  <div class="card-header">
    Featured
  </div>

<div class="footer">
  <div class="card-body">
    <h5 class="card-title">Contact Us</h5>
    <p class="card-text">
      <i class="fa-brands fa-instagram"></i>
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-telegram"></i>
      <i class="fa-solid fa-envelope"></i>
    </p>
  
  </div>
</div>
  <div class="card-footer text-body-secondary">
    Ⓒ 2024 Getbus India Pvt Ltd. All rights reserved
  </div>
</div>






































<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>
